name: Generate Release Keystore

# ম্যানুয়ালি চালাতে হবে: GitHub repo → Actions ট্যাব → এই workflow বেছে → "Run workflow"
# এটা একবারই চালাবে। এখান থেকে যে keystore পাবে সেটাই ভবিষ্যতে সব release build এ ব্যবহার হবে,
# তাই ডাউনলোড করা ফাইলটা যত্ন করে রাখতে হবে।
on:
  workflow_dispatch:
    inputs:
      key_alias:
        description: "Key alias (মনে রাখার মতো একটা নাম, যেমন bnwidget)"
        required: true
        default: "bnwidget"
      store_password:
        description: "Keystore password (কমপক্ষে ৬ ক্যারেক্টার)"
        required: true
      key_password:
        description: "Key password (store password এর মতোই দিতে পারো)"
        required: true
      validity_years:
        description: "Validity (বছর) — Play Store এর জন্য কমপক্ষে ২৫ বছর রাখা ভালো"
        required: true
        default: "30"
      common_name:
        description: "তোমার নাম বা প্রতিষ্ঠানের নাম (CN)"
        required: true
        default: "Bengali Calendar Developer"

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK (keytool এর জন্য)
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Generate keystore
        run: |
          VALIDITY_DAYS=$(( ${{ github.event.inputs.validity_years }} * 365 ))
          keytool -genkeypair -v \
            -keystore release.keystore \
            -alias "${{ github.event.inputs.key_alias }}" \
            -keyalg RSA -keysize 2048 \
            -validity $VALIDITY_DAYS \
            -storepass "${{ github.event.inputs.store_password }}" \
            -keypass "${{ github.event.inputs.key_password }}" \
            -dname "CN=${{ github.event.inputs.common_name }}, OU=Dev, O=Dev, L=Kolkata, S=WB, C=IN"

      - name: Base64 encode (secrets এ পেস্ট করার জন্য)
        run: base64 -w0 release.keystore > release.keystore.base64.txt

      - name: Upload keystore + base64 + info
        uses: actions/upload-artifact@v4
        with:
          name: release-keystore
          path: |
            release.keystore
            release.keystore.base64.txt
          retention-days: 90
