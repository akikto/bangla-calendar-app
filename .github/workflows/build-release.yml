name: Build Signed Release (AAB + APK)

# চালানোর আগে অবশ্যই repo Settings → Secrets and variables → Actions এ এই ৪টা secret যোগ করতে হবে:
#   KEYSTORE_BASE64   → generate-keystore workflow থেকে পাওয়া release.keystore.base64.txt এর ভেতরের পুরো টেক্সট
#   KEYSTORE_PASSWORD → keystore বানানোর সময় দেওয়া store password
#   KEY_ALIAS         → keystore বানানোর সময় দেওয়া alias
#   KEY_PASSWORD      → keystore বানানোর সময় দেওয়া key password
on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required SDK platform & build-tools
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "${{ github.workspace }}/release.keystore"

      - name: Build release AAB + APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle bundleRelease assembleRelease --stacktrace

      - name: Upload AAB (Play Store এ আপলোড করার জন্য)
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: app/build/outputs/bundle/release/app-release.aab

      - name: Upload APK (নিজের ফোনে টেস্ট করার জন্য)
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: app/build/outputs/apk/release/app-release.apk

      - name: Remove keystore from runner
        if: always()
        run: rm -f "${{ github.workspace }}/release.keystore"
