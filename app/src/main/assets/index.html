const bnCalMonths = ['বৈশাখ','জ্যৈষ্ঠ','আষাঢ়','শ্রাবণ','ভাদ্র','আশ্বিন','কার্তিক','অগ্রহায়ণ','পৌষ','মাঘ','ফাল্গুন','চৈত্র'];

function toBn(n) {
    const d = ['০','১','২','৩','৪','৫','৬','৭','৮','৯'];
    return String(n).split('').map(c => d[parseInt(c)] ?? c).join('');
}

const bnStarts = [
    [3,14],[4,16],[5,16],[6,17],[7,17],[8,17],
    [9,17],[10,16],[11,16],[0,15],[1,14],[2,15]
];

function makeStart(idx, baseYear) {
    const [m, d] = bnStarts[idx];
    const yr = (idx >= 9) ? baseYear + 1 : baseYear;
    return new Date(yr, m, d);
}

function getBengaliInfo(jsDate) {
    const y = jsDate.getFullYear();
    for (let base = y; base >= y - 1; base--) {
        for (let i = 0; i < 12; i++) {
            const start = makeStart(i, base);
            const end   = makeStart((i + 1) % 12, i === 11 ? base + 1 : base);
            if (jsDate >= start && jsDate < end) {
                return {
                    day: Math.floor((jsDate - start) / 86400000) + 1,
                    monthName: bnCalMonths[i]
                };
            }
        }
    }
    return { day: 1, monthName: '' };
}

};

const typeLabels = {
    festival: "উৎসব",
    birthday: "জন্মদিন",
    important: "গুরুত্বপূর্ণ দিন",
    bank: "ব্যাংক হলিডে",
    gov: "সরকারি ছুটি"
};

function getEvents(year, month, day) {
    return events[year + '-' + month + '-' + day] || [];
}

function addEventDots(cell, evs) {
    if (!evs.length) return;
    const wrap = document.createElement('div');
    wrap.className = 'event-dots';
    evs.slice(0, 4).forEach(e => {
        const dot = document.createElement('span');
        dot.className = 'dot-' + e.type;
        wrap.appendChild(dot);
    });
    cell.appendChild(wrap);
}

function openModal(year, month, day, evs) {
    const dateStr = day + ' ' + bnMonthNames[month] + ' ' + year;
    document.getElementById('modal-date').textContent = dateStr;
    const body = document.getElementById('modal-body');
    body.innerHTML = '';
    if (!evs.length) {
        const p = document.createElement('div');
        p.className = 'no-event';
        p.textContent = 'এই দিনে কোনো ইভেন্ট নেই।';
        body.appendChild(p);
    } else {
        evs.forEach(e => {
            const row = document.createElement('div');
            row.className = 'event-item';
            const dot = document.createElement('div');
            dot.className = 'dot-lg dot-' + e.type;
            const text = document.createElement('div');
            text.innerHTML = '<div class="ev-title"></div><div class="ev-type"></div>';
            text.querySelector('.ev-title').textContent = e.title;
            text.querySelector('.ev-type').textContent = typeLabels[e.type] || e.type;
            row.appendChild(dot);
            row.appendChild(text);
            body.appendChild(row);
        });
    }
    document.getElementById('event-modal').classList.add('open');
}

function closeModal() {
    document.getElementById('event-modal').classList.remove('open');
}

function renderCalendar(year, month) {
    document.getElementById('header-title').textContent = bnMonthNames[month] + ' ' + year;
    const grid = document.getElementById('days-grid');
    grid.innerHTML = '';

    const firstDay = new Date(year, month, 1).getDay();
    const daysInMonth = new Date(year, month + 1, 0).getDate();
    const prevMonthDays = new Date(year, month, 0).getDate();

    for (let i = 0; i < firstDay; i++) {
        const c = document.createElement('div');
        c.className = 'day-cell empty-cell';
        grid.appendChild(c);
    }

    let prevBnMonth = '';

    for (let d = 1; d <= daysInMonth; d++) {
        const date = new Date(year, month, d);
        const isSunday = date.getDay() === 0;
        const isToday = d === today.getDate() && month === today.getMonth() && year === today.getFullYear();
        const bnInfo = getBengaliInfo(date);

        const cell = document.createElement('div');
        cell.className = 'day-cell' + (isToday ? ' today-cell' : '');

        // TOP: বাংলা মাসের নাম (শুধু যখন বদলায়)
        if (bnInfo.monthName !== prevBnMonth) {
            const mnSpan = document.createElement('div');
            mnSpan.className = 'bn-month-label';
            mnSpan.textContent = bnInfo.monthName;
            cell.appendChild(mnSpan);
            prevBnMonth = bnInfo.monthName;
        } else {
            const placeholder = document.createElement('div');
            placeholder.className = 'bn-month-placeholder';
            cell.appendChild(placeholder);
        }

        // MIDDLE: ইংরেজি তারিখ
        const num = document.createElement('div');
        num.className = 'day-number' + (isSunday ? ' holiday' : '');
        num.textContent = d;
        cell.appendChild(num);

        // BOTTOM: বাংলা তারিখ
        const sub = document.createElement('div');
        sub.className = 'sub-text';
        sub.textContent = toBn(bnInfo.day);
        cell.appendChild(sub);

        const evs = getEvents(year, month, d);
        addEventDots(cell, evs);
        cell.style.cursor = 'pointer';
        cell.addEventListener('click', () => openModal(year, month, d, evs));

        grid.appendChild(cell);
    }

    const rem = (firstDay + daysInMonth) % 7;
    if (rem !== 0) {
        for (let i = 0; i < 7 - rem; i++) {
            const c = document.createElement('div');
            c.className = 'day-cell empty-cell';
            grid.appendChild(c);
        }
    }
}

function renderMiniCalendar(prefix, year, month) {
    document.getElementById(prefix + '-mini-title').textContent = bnMonthNames[month] + ' ' + year + ' (১-১৪)';
    const g = document.getElementById(prefix + '-mini-grid');
    g.innerHTML = '';

    const firstDay = new Date(year, month, 1).getDay();
    for (let i = 0; i < firstDay; i++) {
        const blank = document.createElement('div');
        blank.className = 'mini-cell mini-empty';
        g.appendChild(blank);
    }

    for (let d = 1; d <= 14; d++) {
        const date = new Date(year, month, d);
        const bnInfo = getBengaliInfo(date);
        const cell = document.createElement('div');
        cell.className = 'mini-cell';
        const mn = document.createElement('div');
        mn.className = 'mn';
        mn.textContent = d;
        const ms = document.createElement('div');
        ms.className = 'ms';
        ms.textContent = toBn(bnInfo.day);
        cell.appendChild(mn);
        cell.appendChild(ms);
        g.appendChild(cell);
    }
}

function changeMonth(dir) {
    currentMonth += dir;
    if (currentMonth > 11) { currentMonth = 0; currentYear++; }
    if (currentMonth < 0)  { currentMonth = 11; currentYear--; }
    renderAll(currentYear, currentMonth);
}

function renderAll(year, month) {
    renderCalendar(year, month);
    const pm = month === 0 ? 11 : month - 1;
    const py = month === 0 ? year - 1 : year;
    const nm = month === 11 ? 0 : month + 1;
    const ny = month === 11 ? year + 1 : year;
    renderMiniCalendar('prev', py, pm);
    renderMiniCalendar('next', ny, nm);
}

renderAll(currentYear, currentMonth);
</script>
